# Prévisualisation sur GitHub Pages : https://bixboy.github.io/Osteopathe-WebSite/
# Construit et publie le site à chaque push sur `main`. Version NON indexée (SITE_PREVIEW) pour
# ne pas concurrencer le futur domaine. Mise en ligne définitive sur OVH : deploy.yml.

name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Fournit l'adresse publique (origin) et le sous-chemin (base_path) de GitHub Pages
      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Construire le site
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_PREVIEW: true

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
